services:
  postgres:
    image: postgres:16-alpine
    container_name: neurons-postgres
    environment:
      POSTGRES_DB: neuronsdb
      POSTGRES_USER: neurons
      POSTGRES_PASSWORD: supersecret
    ports:
      - "5490:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U neurons"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: neurons-redis
    ports:
      - "6390:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
